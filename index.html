<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>BAR / 7 NIGHTS</title>

  <!-- Пиксельный шрифт -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game">
    <div id="status"></div>

    <div id="characters">
      <div class="character bartender">
        <div class="sprite sprite-bartender"></div>
        <div class="name">Бармен</div>
      </div>

      <div class="character guest">
        <div class="sprite sprite-guest"></div>
        <div class="name" id="guest-name">Гость</div>
      </div>
    </div>

    <div id="dialog-container">
      <div id="dialog-box">
        <div id="dialog-text"></div>
      </div>
    </div>

    <div id="choices"></div>
    <div id="hint"></div>
  </div>

  <script src="js/guests.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
